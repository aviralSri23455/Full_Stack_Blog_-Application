[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python -m pip install --user --upgrade pip",
  "python -m pip install --user -r requirements.txt"
]

[phases.build]
cmds = [
  "cd backend && python manage.py collectstatic --noinput || echo 'Static files skipped'"
]

[start]
cmd = "cd backend && python manage.py migrate --noinput && gunicorn blog_backend.wsgi:application --bind 0.0.0.0:$PORT"

[variables]
PYTHONPATH = "/app/backend"
DJANGO_SETTINGS_MODULE = "blog_backend.settings"
PATH = "/root/.local/bin:$PATH"
