[build]
  # Frontend build settings for React app
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Node.js version for frontend
  NODE_VERSION = "20"

# Redirect all requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for production
[context.production.environment]
  VITE_API_URL = "https://fullstackblog-application-production.up.railway.app/api"

[context.deploy-preview.environment]
  VITE_API_URL = "https://fullstackblog-application-production.up.railway.app/api"
